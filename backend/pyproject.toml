[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bibtech-backend"
version = "0.1.0"
description = "Backend de Python configurado dinámicamente"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "psycopg2-binary>=2.9.9",
    "rispy>=0.9.0",
    "bibtexparser>=1.4.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "passlib[bcrypt]>=1.7.4",
    "networkx>=3.3",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.1",


    "matplotlib>=3.8",
    "seaborn>=0.13",
    "wordcloud>=1.9",


    "python-louvain>=0.16",
]
