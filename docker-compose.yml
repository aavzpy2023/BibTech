services:

  backend:
    container_name: bibtech-backend
    build: ./backend
    command: >
      sh -c "cd /project/backend && alembic upgrade head &&
      uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"
    expose:
      - "8000"
    volumes:
      - ./:/project
    working_dir: /project
    environment:
      - PYTHONPATH=/project
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://user:password@db:5432/dbname
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: bibtech-frontend
    build: ./frontend
    expose:
      - "5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  nginx:
    container_name: bibtech-nginx
    build: ./nginx
    ports:
      - "88:80"
    depends_on:
      - frontend
      - backend

  db:
    container_name: bibtech-postgres
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=dbname
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d dbname"]
      interval: 2s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
